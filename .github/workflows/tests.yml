name: Pull Request Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: |
          set -o pipefail
          python -m unittest discover -s CoachingServer/tests -v | tee python-test-output.txt
          python -m unittest discover -s Tools/CoachingEval/tests -v | tee -a python-test-output.txt
      - name: Upload Python test output
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: python-test-output
          path: python-test-output.txt

  ipad:
    name: iPad
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Run iPad tests
        run: xcodebuild test -project ChessTutor.xcodeproj -scheme ChessTutor -destination 'platform=iOS Simulator,name=iPad (A16)' -resultBundlePath ChessTutor.xcresult
      - name: Upload Xcode result bundle
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ChessTutor.xcresult
          path: ChessTutor.xcresult
