name: ChessTutor
options:
  bundleIdPrefix: org.jasoncrawford
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
targets:
  ChessTutor:
    type: application
    platform: iOS
    sources:
      - ChessTutor
    info:
      path: ChessTutor/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: org.jasoncrawford.chesstutor
            CFBundleURLSchemes:
              - chesstutor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: org.jasoncrawford.chesstutor
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ChessTutorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ChessTutorTests
    dependencies:
      - target: ChessTutor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
