name: ChessTutor
options:
  bundleIdPrefix: org.jasoncrawford
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
targets:
  ChessTutor:
    type: application
    platform: iOS
    sources:
      - ChessTutor
    postBuildScripts:
      - name: Embed Build Info
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/BuildInfo.plist"
        script: |
          set -euo pipefail

          revision="unknown"
          if command -v git >/dev/null 2>&1 && git -C "$SRCROOT" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            revision="$(git -C "$SRCROOT" rev-parse --short=12 HEAD 2>/dev/null || echo unknown)"
            if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then
              revision="${revision}-dirty"
            fi
          fi

          output="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          mkdir -p "$(dirname "$output")"
          cat > "$output" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GitCommit</key>
            <string>$revision</string>
          </dict>
          </plist>
          EOF
    info:
      path: ChessTutor/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: org.jasoncrawford.chesstutor
            CFBundleURLSchemes:
              - chesstutor
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: org.jasoncrawford.chesstutor
        CODE_SIGN_ENTITLEMENTS: ChessTutor/ChessTutor.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T2YLUCCPQ3
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ChessTutorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ChessTutorTests
    dependencies:
      - target: ChessTutor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  ChessTutor:
    build:
      targets:
        ChessTutor: all
    run:
      config: Debug
      environmentVariables:
        CHESSTUTOR_REMOTE_INVITES: cloudkit
    test:
      config: Debug
      targets:
        - ChessTutorTests
